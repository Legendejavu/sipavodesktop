name: macOS Acceptance Test Build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Exact Legendejavu/sipova source commit"
        required: true
      version:
        description: "Pilot version, for example 2.0.0-pilot.3"
        required: true
      confirm_test:
        description: "Type MAC-TEST to confirm non-production build"
        required: true

permissions:
  contents: read

concurrency:
  group: macos-acceptance-test-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Guard non-production pilot build
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          CONFIRM: ${{ inputs.confirm_test }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == "MAC-TEST" ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-pilot\.[0-9]+$ ]]

      - uses: actions/checkout@v4
        with:
          repository: Legendejavu/sipova
          ref: ${{ inputs.source_ref }}
          path: source
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install and test source
        working-directory: source
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prisma generate
          pnpm desktop:build
          pnpm desktop:test
          pnpm exec tsc --noEmit -p tsconfig.typecheck.json
          git diff --check

      - name: Require signing and notarization credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ secrets.MAC_CSC_LINK }}'
          test -n '${{ secrets.MAC_CSC_KEY_PASSWORD }}'
          test -n '${{ secrets.APPLE_API_KEY }}'
          test -n '${{ secrets.APPLE_API_KEY_ID }}'
          test -n '${{ secrets.APPLE_API_ISSUER }}'

      - name: Configure packaged acceptance marker and pilot channel
        working-directory: source
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'apps/printer-agent/package.json';
          const value = JSON.parse(fs.readFileSync(path));
          if (value.sipavoAcceptanceBuild !== undefined) throw new Error('SOURCE_MUST_DEFAULT_TO_PRODUCTION_POLICY');
          value.version = process.env.RELEASE_VERSION;
          value.sipavoUpdateChannel = 'pilot';
          value.sipavoAcceptanceBuild = true;
          const provider = value.build.publish[0];
          provider.owner = 'Legendejavu';
          provider.repo = 'sipavodesktop';
          provider.releaseType = 'prerelease';
          provider.channel = 'pilot';
          fs.writeFileSync(path, JSON.stringify(value, null, 2) + '\n');
          const packaged = JSON.parse(fs.readFileSync(path));
          if (packaged.sipavoAcceptanceBuild !== true || packaged.build.publish[0].repo !== 'sipavodesktop') {
            throw new Error('MAC_ACCEPTANCE_METADATA_INVALID');
          }
          NODE

      - name: Materialize notarization API key
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"
          printf '%s' '${{ secrets.APPLE_API_KEY }}' | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Build signed and notarized macOS acceptance artifacts
        working-directory: source
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm --dir apps/printer-agent exec electron-builder --mac dmg zip --arm64 --x64 --publish never

      - name: Verify signing, Team ID, notarization, and package marker
        working-directory: source
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          found=0
          for app_path in apps/printer-agent/release/mac*/Sipavo.app; do
            test -d "$app_path"
            found=1
            codesign --verify --deep --strict --verbose=2 "$app_path"
            codesign -dv --verbose=4 "$app_path" 2>&1 | grep -F 'TeamIdentifier=993TKHK732'
            xcrun stapler validate "$app_path"
          done
          [[ "$found" == 1 ]]
          for dmg in apps/printer-agent/release/Sipavo-${RELEASE_VERSION}-*.dmg; do
            test -f "$dmg"
            xcrun stapler validate "$dmg"
            shasum -a 256 "$dmg"
          done

      - name: Stage DMGs and checksums
        id: stage
        working-directory: source
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/sipavo-macos-${RELEASE_VERSION}-test"
          mkdir -p "$stage"
          cp apps/printer-agent/release/Sipavo-${RELEASE_VERSION}-*.dmg "$stage/"
          (cd "$stage" && shasum -a 256 *.dmg > SHA256SUMS.txt)
          echo "artifact_path=$stage" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: sipavo-desktop-macos-${{ inputs.version }}-test
          path: ${{ steps.stage.outputs.artifact_path }}/*
          if-no-files-found: error
          retention-days: 14
