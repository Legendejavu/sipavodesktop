name: Desktop Distribution

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Legendejavu/sipova source ref"
        required: true
      version:
        description: "Stable X.Y.Z or pilot X.Y.Z-pilot.N"
        required: true
      channel:
        description: "Distribution channel"
        required: true
        default: pilot
        type: choice
        options: [pilot, stable]
      publish:
        description: "Create GitHub release after all gates"
        required: true
        default: false
        type: boolean
      confirm:
        description: "PILOT for pilot publish; RELEASE for stable publish"
        required: false
      migration_evidence_run_id:
        description: "Successful clean-Windows migration evidence workflow run id"
        required: false
      windows_candidate_run_id:
        description: "Signed Windows candidate workflow run id; required for publish"
        required: false

permissions:
  actions: read
  contents: write

concurrency:
  group: desktop-distribution-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.guard.outputs.tag }}
    steps:
      - id: guard
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          PUBLISH: ${{ inputs.publish }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == pilot ]]; then
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-pilot\.[0-9]+$ ]]
            [[ "$PUBLISH" != true || "$CONFIRM" == PILOT ]]
          else
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            [[ "$PUBLISH" != true || "$CONFIRM" == RELEASE ]]
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  macos:
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Legendejavu/sipova
          ref: ${{ inputs.source_ref }}
          path: source
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm, cache-dependency-path: source/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: source
      - name: Test source
        working-directory: source
        run: |
          pnpm desktop:build
          pnpm desktop:test
          pnpm typecheck
          pnpm exec tsx tests/print-transport-semantics.unit.ts
          pnpm exec tsx tests/printer-discovery-filter.unit.ts
      - name: Require signing credentials
        shell: bash
        run: |
          test -n "${{ secrets.MAC_CSC_LINK }}"
          test -n "${{ secrets.MAC_CSC_KEY_PASSWORD }}"
          test -n "${{ secrets.APPLE_API_KEY }}"
          test -n "${{ secrets.APPLE_API_KEY_ID }}"
          test -n "${{ secrets.APPLE_API_ISSUER }}"
      - name: Materialize notarization key
        shell: bash
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"
          printf '%s' '${{ secrets.APPLE_API_KEY }}' | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
      - name: Build signed and notarized Mac artifacts
        working-directory: source
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SIPAVO_DESKTOP_UPDATE_CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e 'const fs=require("fs");const p="apps/printer-agent/package.json";const j=JSON.parse(fs.readFileSync(p));j.version=process.env.RELEASE_VERSION;fs.writeFileSync(p,JSON.stringify(j,null,2)+"\n")'
          pnpm desktop:build:mac
      - name: Verify Mac gates
        working-directory: source
        run: |
          for APP in apps/printer-agent/release/mac*/Sipavo.app; do
            codesign --verify --deep --strict --verbose=2 "$APP"
            codesign -dv --verbose=4 "$APP" 2>&1 | grep 'TeamIdentifier=993TKHK732'
            xcrun stapler validate "$APP"
            spctl --assess --type execute --verbose=4 "$APP"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sipavo-desktop-${{ inputs.channel }}-${{ inputs.version }}
          path: source/apps/printer-agent/release/*

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Legendejavu/sipova
          ref: ${{ inputs.source_ref }}
          path: source
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm, cache-dependency-path: source/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: source
      - name: Test Windows source
        working-directory: source
        run: |
          pnpm desktop:build
          pnpm desktop:test
          pnpm typecheck
          pnpm exec tsx tests/print-transport-semantics.unit.ts
          pnpm exec tsx tests/print-job-protocol-v2.integration.ts
          pnpm exec tsx tests/printer-discovery-filter.unit.ts
          pnpm exec tsx tests/cash-drawer-pulse.unit.ts
      - name: Require Windows signing credentials and evidence run
        shell: bash
        run: |
          test -n "${{ secrets.WIN_CSC_LINK }}"
          test -n "${{ secrets.WIN_CSC_KEY_PASSWORD }}"
          if [[ "${{ inputs.publish }}" == true ]]; then
            test -n "${{ inputs.windows_candidate_run_id }}"
            if [[ "${{ inputs.channel }}" == stable ]]; then test -n "${{ inputs.migration_evidence_run_id }}"; fi
          fi
      - name: Configure requested version and channel
        working-directory: source
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          node - <<'NODE'
          const fs=require('fs'); const path='apps/printer-agent/package.json';
          const value=JSON.parse(fs.readFileSync(path));
          value.version=process.env.RELEASE_VERSION;
          value.sipavoUpdateChannel=process.env.RELEASE_CHANNEL;
          const provider=value.build.publish[0];
          provider.releaseType=process.env.RELEASE_CHANNEL==='pilot'?'prerelease':'release';
          if(process.env.RELEASE_CHANNEL==='pilot') provider.channel='pilot'; else delete provider.channel;
          fs.writeFileSync(path,JSON.stringify(value,null,2)+'\n');
          NODE
      - name: Build signed NSIS on Windows
        if: ${{ inputs.windows_candidate_run_id == '' }}
        working-directory: source
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm --dir apps/printer-agent dist:win:setup:signed
      - name: Download the exact signed Windows candidate
        if: ${{ inputs.windows_candidate_run_id != '' }}
        shell: powershell
        run: gh run download "${{ inputs.windows_candidate_run_id }}" --repo "$env:GITHUB_REPOSITORY" --name "sipavo-desktop-windows-${{ inputs.channel }}-${{ inputs.version }}" --dir source/apps/printer-agent/release
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify Authenticode and updater metadata
        working-directory: source
        shell: powershell
        run: |
          $installer = Get-Item "apps/printer-agent/release/Sipavo-Setup-${{ inputs.version }}-x64.exe"
          if ((Get-AuthenticodeSignature $installer.FullName).Status -ne "Valid") { throw "AUTHENTICODE_INVALID" }
          $metadata = if ("${{ inputs.channel }}" -eq "pilot") { "pilot.yml" } else { "latest.yml" }
          if (-not (Test-Path "apps/printer-agent/release/$metadata")) { throw "UPDATER_METADATA_MISSING" }
          if (Test-Path "apps/printer-agent/release/$(if ('${{ inputs.channel }}' -eq 'pilot') {'latest.yml'} else {'pilot.yml'})") { throw "CHANNEL_METADATA_LEAK" }
      - name: Download published legacy 1.0.8 fixture
        if: ${{ inputs.publish && inputs.channel == 'stable' }}
        working-directory: source
        shell: powershell
        run: |
          gh release download v1.0.8 --repo Legendejavu/sipavo-printer-agent-releases --pattern "Sipavo-Printer-Agent-Setup-1.0.8-x64.exe" --dir apps/printer-agent/release
          $hash=(Get-FileHash apps/printer-agent/release/Sipavo-Printer-Agent-Setup-1.0.8-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "7cfffbfb52acb009e55bd6264dd38f2d6c52d94dd8f0f78c5fced09ec3a02303") { throw "LEGACY_FIXTURE_HASH_MISMATCH" }
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download clean-Windows migration evidence
        if: ${{ inputs.publish && inputs.channel == 'stable' }}
        shell: powershell
        run: gh run download "${{ inputs.migration_evidence_run_id }}" --repo "$env:GITHUB_REPOSITORY" --name sipavo-windows-migration-evidence --dir evidence
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify packaged migration evidence
        if: ${{ inputs.publish && inputs.channel == 'stable' }}
        working-directory: source
        shell: powershell
        run: apps/printer-agent/scripts/verify-installer-migration.ps1 -EvidencePath "$env:GITHUB_WORKSPACE/evidence/windows-migration-evidence.json"
      - uses: actions/upload-artifact@v4
        with:
          name: sipavo-desktop-windows-${{ inputs.channel }}-${{ inputs.version }}
          path: |
            source/apps/printer-agent/release/*
            !source/apps/printer-agent/release/Sipavo-Printer-Agent-Setup-1.0.8-x64.exe

  publish:
    if: ${{ inputs.publish }}
    needs: [validate, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sipavo-desktop-${{ inputs.channel }}-${{ inputs.version }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: sipavo-desktop-windows-${{ inputs.channel }}-${{ inputs.version }}
          path: release
      - name: Publish pilot prerelease or approved stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --title "Sipavo Desktop ${{ inputs.version }}" --generate-notes)
          if [[ "${{ inputs.channel }}" == pilot ]]; then args+=(--prerelease); fi
          gh release create "${{ needs.validate.outputs.tag }}" release/* "${args[@]}"
